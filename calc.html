<html lang="en" class="scroll-smooth"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Calculator - Readymation</title>
    <link rel="icon" type="image/png" href="ReadymationNoBG.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                            950: '#431407',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-200 font-sans antialiased selection:bg-brand-500/30 selection:text-brand-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 border-b border-white/5 bg-neutral-950/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-center">
            <div class="flex items-center gap-12">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="ReadymationNoBG.png" alt="Readymation Logo" class="h-10 w-auto">
                    <span class="text-white font-medium text-xl">Readymation</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Calculator -->
    <main class="flex-1 flex items-center justify-center pt-32 pb-20 px-6 relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[400px] bg-brand-500/8 blur-[120px] rounded-full pointer-events-none -z-10"></div>

        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-medium text-white tracking-tight mb-3">Lead Calculator</h1>
                <p class="text-neutral-400">How many emails to scrape this week.</p>
            </div>

            <div class="bg-neutral-900/50 border border-neutral-800 rounded-2xl p-8 space-y-6">

                <!-- Tag Selector -->
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Mailbox Tags</label>
                    <div id="tagDropdown" class="relative">
                        <button id="tagToggle" type="button"
                            class="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-4 py-3 text-left text-lg focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500/50 transition-colors flex items-center justify-between">
                            <span id="tagPlaceholder" class="text-neutral-600">Loading tags...</span>
                            <svg class="w-5 h-5 text-neutral-500 shrink-0 transition-transform duration-200" id="tagChevron" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div id="tagMenu" class="hidden absolute top-full left-0 right-0 mt-2 bg-neutral-950 border border-neutral-700 rounded-xl overflow-hidden z-50 shadow-2xl shadow-black/50 max-h-60 overflow-y-auto">
                            <!-- Tags populated by JS -->
                        </div>
                    </div>
                    <!-- Selected tag pills -->
                    <div id="tagPills" class="flex flex-wrap gap-2 mt-3"></div>
                </div>

                <!-- Mailbox count (auto-filled, read-only display) -->
                <div class="flex items-center justify-between bg-neutral-950/50 border border-neutral-800 rounded-xl px-4 py-3">
                    <span class="text-sm text-neutral-500">Mailboxes selected</span>
                    <span id="mailboxCount" class="text-lg font-medium text-white">0</span>
                </div>

                <!-- Emails per inbox -->
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Emails Sent Per Inbox / Day</label>
                    <input id="emailsPerInbox" type="number" min="1" value="20"
                        class="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500/50 transition-colors">
                </div>

                <!-- Sequence Length -->
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Sequence Length</label>
                    <div class="flex gap-3">
                        <button data-seq="1" class="seq-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-neutral-700 bg-neutral-950 text-neutral-400 hover:border-neutral-600">1</button>
                        <button data-seq="2" class="seq-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-brand-500 bg-brand-500/10 text-brand-400">2</button>
                        <button data-seq="3" class="seq-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-neutral-700 bg-neutral-950 text-neutral-400 hover:border-neutral-600">3</button>
                    </div>
                </div>

                <!-- Validation % -->
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Validation Rate <span id="validationDisplay" class="text-brand-400">40%</span></label>
                    <input id="validation" type="range" min="10" max="100" value="40" step="5"
                        class="w-full h-2 bg-neutral-800 rounded-full appearance-none cursor-pointer accent-brand-500 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-5 [&::-webkit-slider-thumb]:h-5 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-brand-500 [&::-webkit-slider-thumb]:shadow-[0_0_10px_rgba(249,115,22,0.5)] [&::-moz-range-thumb]:w-5 [&::-moz-range-thumb]:h-5 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:bg-brand-500 [&::-moz-range-thumb]:border-0">
                </div>

                <!-- Sending Days -->
                <div>
                    <label class="block text-sm font-medium text-neutral-400 mb-2">Sending Days / Week</label>
                    <div class="flex gap-2">
                        <button data-days="5" class="days-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-brand-500 bg-brand-500/10 text-brand-400">5</button>
                        <button data-days="6" class="days-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-neutral-700 bg-neutral-950 text-neutral-400 hover:border-neutral-600">6</button>
                        <button data-days="7" class="days-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-neutral-700 bg-neutral-950 text-neutral-400 hover:border-neutral-600">7</button>
                    </div>
                </div>

                <!-- Divider -->
                <div class="h-px bg-neutral-800"></div>

                <!-- Results -->
                <div id="results" class="hidden space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-neutral-400">Leads needed / week</span>
                        <span id="weeklyLeads" class="text-xl font-medium text-white">--</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-neutral-400">Emails to scrape / week</span>
                        <span id="weeklyScrape" class="text-2xl font-medium text-brand-400">--</span>
                    </div>
                </div>

                <!-- Empty state -->
                <p id="emptyState" class="text-center text-neutral-600 text-sm py-2">Select tags to see results.</p>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 py-8 text-center text-neutral-600 text-sm">
        &copy; 2024 Readymation Inc.
    </footer>

    <script>
        const emailsPerInboxInput = document.getElementById('emailsPerInbox');
        const validationInput = document.getElementById('validation');
        const validationDisplay = document.getElementById('validationDisplay');
        const weeklyLeadsEl = document.getElementById('weeklyLeads');
        const weeklyScrapeEl = document.getElementById('weeklyScrape');
        const resultsEl = document.getElementById('results');
        const emptyStateEl = document.getElementById('emptyState');
        const mailboxCountEl = document.getElementById('mailboxCount');
        const tagToggle = document.getElementById('tagToggle');
        const tagMenu = document.getElementById('tagMenu');
        const tagPlaceholder = document.getElementById('tagPlaceholder');
        const tagPills = document.getElementById('tagPills');
        const tagChevron = document.getElementById('tagChevron');

        let sequenceLength = 2;
        let sendingDays = 5;
        let tags = [];
        let selectedTagIds = new Set();

        // Fetch tags from API
        async function loadTags() {
            try {
                const resp = await fetch('/api/tags');
                tags = await resp.json();
                tagPlaceholder.textContent = 'Select tags...';
                renderTagMenu();
            } catch (err) {
                tagPlaceholder.textContent = 'Failed to load tags';
            }
        }

        function renderTagMenu() {
            tagMenu.innerHTML = tags.map(tag => `
                <button type="button" data-tag-id="${tag.tag_id}"
                    class="tag-option w-full px-4 py-3 text-left hover:bg-neutral-900 transition-colors flex items-center justify-between ${selectedTagIds.has(tag.tag_id) ? 'bg-neutral-900' : ''}">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded border ${selectedTagIds.has(tag.tag_id) ? 'bg-brand-500 border-brand-500' : 'border-neutral-600'} flex items-center justify-center shrink-0">
                            ${selectedTagIds.has(tag.tag_id) ? '<svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
                        </div>
                        <span class="${selectedTagIds.has(tag.tag_id) ? 'text-white' : 'text-neutral-300'}">${tag.tag_name}</span>
                    </div>
                    <span class="text-sm text-neutral-600">${tag.count}</span>
                </button>
            `).join('');

            tagMenu.querySelectorAll('.tag-option').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.tagId);
                    if (selectedTagIds.has(id)) {
                        selectedTagIds.delete(id);
                    } else {
                        selectedTagIds.add(id);
                    }
                    renderTagMenu();
                    renderPills();
                    updateMailboxCount();
                    calculate();
                });
            });
        }

        function renderPills() {
            const selected = tags.filter(t => selectedTagIds.has(t.tag_id));
            if (selected.length === 0) {
                tagPlaceholder.textContent = 'Select tags...';
                tagPlaceholder.className = 'text-neutral-600';
            } else {
                tagPlaceholder.textContent = `${selected.length} tag${selected.length > 1 ? 's' : ''} selected`;
                tagPlaceholder.className = 'text-white';
            }

            tagPills.innerHTML = selected.map(tag => `
                <span class="inline-flex items-center gap-1.5 bg-brand-500/10 border border-brand-500/30 text-brand-400 text-sm px-3 py-1 rounded-full">
                    ${tag.tag_name}
                    <button type="button" data-remove="${tag.tag_id}" class="hover:text-white transition-colors">&times;</button>
                </span>
            `).join('');

            tagPills.querySelectorAll('[data-remove]').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedTagIds.delete(parseInt(btn.dataset.remove));
                    renderTagMenu();
                    renderPills();
                    updateMailboxCount();
                    calculate();
                });
            });
        }

        function updateMailboxCount() {
            const count = tags.filter(t => selectedTagIds.has(t.tag_id)).reduce((sum, t) => sum + t.count, 0);
            mailboxCountEl.textContent = count;
        }

        // Toggle dropdown
        tagToggle.addEventListener('click', () => {
            const isOpen = !tagMenu.classList.contains('hidden');
            tagMenu.classList.toggle('hidden');
            tagChevron.style.transform = isOpen ? '' : 'rotate(180deg)';
        });

        // Close dropdown on outside click
        document.addEventListener('click', (e) => {
            if (!document.getElementById('tagDropdown').contains(e.target)) {
                tagMenu.classList.add('hidden');
                tagChevron.style.transform = '';
            }
        });

        // Sending days buttons
        document.querySelectorAll('.days-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sendingDays = parseInt(btn.dataset.days);
                document.querySelectorAll('.days-btn').forEach(b => {
                    b.className = 'days-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-neutral-700 bg-neutral-950 text-neutral-400 hover:border-neutral-600';
                });
                btn.className = 'days-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-brand-500 bg-brand-500/10 text-brand-400';
                calculate();
            });
        });

        // Sequence buttons
        document.querySelectorAll('.seq-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                sequenceLength = parseInt(btn.dataset.seq);
                document.querySelectorAll('.seq-btn').forEach(b => {
                    b.className = 'seq-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-neutral-700 bg-neutral-950 text-neutral-400 hover:border-neutral-600';
                });
                btn.className = 'seq-btn flex-1 py-3 rounded-xl border text-lg font-medium transition-all duration-200 border-brand-500 bg-brand-500/10 text-brand-400';
                calculate();
            });
        });

        // Validation slider
        validationInput.addEventListener('input', () => {
            validationDisplay.textContent = validationInput.value + '%';
            calculate();
        });

        emailsPerInboxInput.addEventListener('input', calculate);

        function calculate() {
            const mailboxes = parseInt(mailboxCountEl.textContent);
            const emailsPerInbox = parseFloat(emailsPerInboxInput.value);
            const validationPct = parseFloat(validationInput.value) / 100;

            if (!mailboxes || mailboxes <= 0 || !emailsPerInbox || emailsPerInbox <= 0) {
                resultsEl.classList.add('hidden');
                emptyStateEl.classList.remove('hidden');
                return;
            }

            const dailyLeads = (mailboxes * emailsPerInbox) / sequenceLength;
            const weeklyLeads = Math.ceil(dailyLeads * sendingDays);
            const weeklyScrape = Math.ceil(weeklyLeads / validationPct);

            weeklyLeadsEl.textContent = weeklyLeads.toLocaleString();
            weeklyScrapeEl.textContent = weeklyScrape.toLocaleString();

            resultsEl.classList.remove('hidden');
            emptyStateEl.classList.add('hidden');
        }

        loadTags();
    </script>

</body></html>

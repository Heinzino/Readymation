<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caption Generator | Readymation</title>
    <link rel="icon" type="image/png" href="ReadymationNoBG.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                            950: '#431407',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); }
            50% { box-shadow: 0 0 40px rgba(249, 115, 22, 0.5); }
        }

        .loading-spinner {
            border: 3px solid rgba(249, 115, 22, 0.2);
            border-top: 3px solid #f97316;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        .result-card:nth-child(1) { animation-delay: 0.1s; }
        .result-card:nth-child(2) { animation-delay: 0.2s; }
        .result-card:nth-child(3) { animation-delay: 0.3s; }
        .result-card:nth-child(4) { animation-delay: 0.4s; }
        .result-card:nth-child(5) { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="ReadymationNoBG.png" alt="Readymation" class="h-8">
            </a>
            <a href="index.html" class="text-zinc-400 hover:text-white transition-colors flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-16 px-6">
        <div class="max-w-3xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-12">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-sm mb-6">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    AI-Powered Caption Generator
                </div>
                <h1 class="text-4xl md:text-5xl font-bold mb-4">
                    Generate <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-brand-600">Platform-Specific</span> Captions
                </h1>
                <p class="text-zinc-400 text-lg max-w-xl mx-auto">
                    Enter your caption and get optimized versions for YouTube, Twitter/X, Snapchat, and more.
                </p>
            </div>

            <!-- Form -->
            <form id="captionForm" class="mb-12">
                <div class="bg-zinc-900/50 border border-zinc-800 rounded-2xl p-6 md:p-8">
                    <label for="caption" class="block text-sm font-medium text-zinc-300 mb-3">
                        Your Caption Idea
                    </label>
                    <textarea
                        id="caption"
                        name="caption"
                        rows="4"
                        placeholder="Enter your caption idea here... e.g., 'Launching our new product that helps businesses automate their marketing'"
                        class="w-full bg-zinc-800/50 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all resize-none"
                        required
                    ></textarea>

                    <button
                        type="submit"
                        id="submitBtn"
                        class="mt-6 w-full bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 text-white font-semibold py-4 px-6 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 group"
                    >
                        <span id="btnText">Generate Captions</span>
                        <i data-lucide="sparkles" class="w-5 h-5 group-hover:scale-110 transition-transform" id="btnIcon"></i>
                        <div id="btnSpinner" class="loading-spinner hidden"></div>
                    </button>
                </div>
            </form>

            <!-- Results Section -->
            <div id="results" class="hidden">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                    <i data-lucide="check-circle" class="w-6 h-6 text-brand-500"></i>
                    Generated Captions
                </h2>

                <div id="resultsContainer" class="space-y-4">
                    <!-- Results will be dynamically inserted here -->
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-red-400 flex items-center gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                <span id="errorText">Something went wrong. Please try again.</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800/50 py-8 px-6">
        <div class="max-w-7xl mx-auto text-center text-zinc-500 text-sm">
            &copy; 2025 Readymation. All rights reserved.
        </div>
    </footer>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Configuration - Update this with your N8N webhook URL
        const N8N_WEBHOOK_URL = 'https://socialzap.app.n8n.cloud/webhook/caption-generator';

        // DOM Elements
        const form = document.getElementById('captionForm');
        const captionInput = document.getElementById('caption');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');
        const resultsSection = document.getElementById('results');
        const resultsContainer = document.getElementById('resultsContainer');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Platform icons and colors
        const platformConfig = {
            YT_Title: { icon: 'youtube', color: 'from-red-500 to-red-600', label: 'YouTube Title' },
            Caption: { icon: 'file-text', color: 'from-brand-500 to-brand-600', label: 'Caption' },
            TwitterCaption: { icon: 'twitter', color: 'from-blue-400 to-blue-500', label: 'Twitter/X' },
            Snapchat_Desc: { icon: 'ghost', color: 'from-yellow-400 to-yellow-500', label: 'Snapchat' }
        };

        // Create result card HTML
        function createResultCard(platform, captionText) {
            const config = platformConfig[platform] || {
                icon: 'message-square',
                color: 'from-brand-500 to-brand-600',
                label: platform
            };

            // Ensure caption is a string
            const caption = String(captionText || '');
            const escapedCaption = caption.replace(/'/g, "\\'").replace(/\n/g, "\\n");

            return `
                <div class="result-card bg-zinc-900/50 border border-zinc-800 rounded-xl p-5 hover:border-zinc-700 transition-colors">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-gradient-to-br ${config.color} flex items-center justify-center">
                                <i data-lucide="${config.icon}" class="w-5 h-5 text-white"></i>
                            </div>
                            <span class="font-semibold text-white">${config.label}</span>
                        </div>
                        <button
                            onclick="copyToClipboard(this, '${escapedCaption}')"
                            class="p-2 text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-lg transition-colors"
                            title="Copy to clipboard"
                        >
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <p class="text-zinc-300 whitespace-pre-wrap">${caption}</p>
                </div>
            `;
        }

        // Copy to clipboard function
        async function copyToClipboard(button, text) {
            try {
                await navigator.clipboard.writeText(text);
                const icon = button.querySelector('i');
                icon.setAttribute('data-lucide', 'check');
                lucide.createIcons();
                button.classList.add('text-green-400');

                setTimeout(() => {
                    icon.setAttribute('data-lucide', 'copy');
                    lucide.createIcons();
                    button.classList.remove('text-green-400');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                btnText.textContent = 'Generating...';
                btnIcon.classList.add('hidden');
                btnSpinner.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            } else {
                btnText.textContent = 'Generate Captions';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        // Show error
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            resultsSection.classList.add('hidden');
        }

        // Hide error
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // Form submission handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const caption = captionInput.value.trim();
            if (!caption) return;

            hideError();
            setLoading(true);
            resultsSection.classList.add('hidden');

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ Caption: caption })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                let data = await response.json();
                console.log('Response data:', data);

                // Handle if response is wrapped in an array
                if (Array.isArray(data) && data.length > 0) {
                    data = data[0];
                }
                // Handle if response has an output property (common n8n pattern)
                if (data.output) {
                    data = data.output;
                }

                // Clear previous results
                resultsContainer.innerHTML = '';

                // Add result cards for each platform
                // Expected response format: { YT_Title: "...", Caption: "...", TwitterCaption: "...", Snapchat_Desc: "..." }
                const orderedPlatforms = ['YT_Title', 'Caption', 'TwitterCaption', 'Snapchat_Desc'];

                for (const platform of orderedPlatforms) {
                    if (data[platform]) {
                        resultsContainer.innerHTML += createResultCard(platform, data[platform]);
                    }
                }

                // Add any additional platforms not in our ordered list
                for (const [platform, caption] of Object.entries(data)) {
                    if (!orderedPlatforms.includes(platform) && caption) {
                        resultsContainer.innerHTML += createResultCard(platform, caption);
                    }
                }

                // Re-initialize Lucide icons for the new content
                lucide.createIcons();

                // Show results
                resultsSection.classList.remove('hidden');

                // Scroll to results
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (error) {
                console.error('Error:', error);
                if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                    showError('CORS error: The webhook needs to allow requests from this domain. Check browser console for details.');
                } else {
                    showError(`Error: ${error.message}`);
                }
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
